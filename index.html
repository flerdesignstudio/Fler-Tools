<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fler Design Studio Tools</title>
    <link rel="icon" type="image/svg+xml" href="src/Assets/Fler_Tools_Icon_Black.svg" media="(prefers-color-scheme: light)">
    <link rel="icon" type="image/svg+xml" href="src/Assets/Fler_Tools_Icon_White.svg" media="(prefers-color-scheme: dark)">
    <link rel="stylesheet" href="src/styles/global.css">
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" as="style"
        onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
    </noscript>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
        rel="stylesheet" />
</head>

<body>
    <!-- Fullscreen Canvas Container -->
    <main class="canvas-container" id="tool-main-container">
        <!-- The background grid will be rendered via CSS on this container or a child -->
    </main>

    <!-- Floating UI Layer -->
    <div class="floating-ui-layer">

        <!-- Left Panel Group (Branding & Settings) -->
        <div class="left-panel-group">
            <!-- Top Left: Branding Frame -->
            <div class="branding-frame panel">
                <div class="logo">
                    <img src="src/Assets/Fler_Logo.svg" alt="Fler Logo"
                        style="width: 32px; height: 32px; object-fit: contain;">
                </div>
                <div class="title-area">
                    <h1 class="title">Tools</h1>
                    <div class="desc">
                        An open source graphic toolkit,<br> make the best of it.
                    </div>
                </div>
            </div>

            <!-- Left: Settings Container -->
            <aside class="settings-frame panel">
                <div class="sidebar-content" id="tool-sidebar-container">
                    <!-- Dynamic Sidebar Injection Container -->
                </div>
            </aside>
        </div>

        <!-- Top Center: Navigation Bar -->
        <div class="nav-bar-wrapper">
            <div class="nav-bar-spacer-left"></div>
            <div class="nav-bar-frame panel" id="app-navigation">
                <!-- Dynamic Navigation Buttons Injected Here -->
            </div>
            <div class="nav-bar-spacer-right"></div>
        </div>

        <!-- Bottom Right: Export Frame -->
        <div class="export-frame panel">
            <button class="notion-btn notion-btn-secondary" id="exportPngBtn">Export PNG</button>
            <button class="notion-btn notion-btn-secondary" id="exportSvgBtn">Export SVG</button>
        </div>

        <!-- Top Right: Fullscreen Button -->
        <button class="fullscreen-btn panel" id="fullscreenBtn" title="Toggle Fullscreen">
            <span class="material-symbols-outlined">fullscreen</span>
        </button>

    </div>

    <!-- Tools Modal Overlay -->
    <div id="tools-modal-overlay" class="tools-modal-overlay">
        <div id="tools-modal-content" class="tools-modal-content panel">
            <div class="tools-modal-header">
                <h2>All Tools</h2>
                <button class="notion-btn notion-btn-secondary close-modal-btn" id="closeToolsModalBtn">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <div id="tools-modal-grid" class="tools-modal-grid">
                <!-- Tool cards will be injected here -->
            </div>
        </div>
    </div>

    <script type="module" src="/src/app.js"></script>
</body>

</html>
